name: _layer (reusable)

# One Terraform layer = plan (read-only role) -> [human approval] -> apply
# the *exact same plan file* (apply role, only inside the protected
# GitHub Environment "production-infra").

on:
  workflow_call:
    inputs:
      layer:
        description: "Directory to run in: platform | addons"
        required: true
        type: string
      apply:
        description: "Also apply (true on main), or plan only (false on PRs)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_org: ${{ github.repository_owner }}
  TF_VAR_app_repo_subject: ${{ vars.APP_REPO_SUBJECT }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_deploy_repo_url: https://github.com/${{ github.repository_owner }}/notes-app-deploy.git
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: plan (${{ inputs.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.layer }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      # -lock=false: the read-only role cannot write the lock file.
      # Safe, because this plan is only a proposal; apply re-checks state.
      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Show plan in job summary
        run: |
          {
            echo "## Terraform plan — ${{ inputs.layer }}"
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.layer }}
          path: ${{ inputs.layer }}/tfplan
          retention-days: 3

  apply:
    name: apply (${{ inputs.layer }})
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-infra   # <- required reviewers = the approval gate
    defaults:
      run:
        working-directory: ${{ inputs.layer }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.layer }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.layer }}
          path: ${{ inputs.layer }}

      - name: Apply the approved plan
        run: terraform apply -input=false -no-color tfplan
